<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ubah Warna</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        #color_area {
            height: 200px;
            background-color: rgb(195, 27, 125);
        }
    </style>
</head>

<body>
    <div class="container mt-3">
        <div class="row mb-3">
            <div class="col" id="color_area"></div>
        </div>
        <div class="row text-center">
            <div class="col d-grid ">
                <button type="button" class="btn btn-danger" onclick="merah()">merah</button>
            </div>

            <div class="col d-grid">
                <button type="button" class="btn btn-primary" onclick="biru()">biru</button>
            </div>
            <div class="col d-grid">
                <button type="button" class="btn btn-success text-light" onclick="hijau()">hijau</button>
            </div>
            <div class="col d-grid">
                <button type="button" class="btn btn-warning" onclick="kuning()">kuning</button>
            </div>
        </div>
    </div>
    <div class="alert alert-info text-center mt-3" role="alert">
        Arisha|25-558141-SV|26291|PGWEB Acara 3
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        //function untuk mengubah warna menjadi merah
        function merah() {
            document.getElementById("color_area").style.
                backgroundColor = "red"
        }
        function biru() {
            document.getElementById("color_area").style.
                backgroundColor = "blue"
        }
        function hijau() {
            document.getElementById("color_area").style.
                backgroundColor = "green"
        }
        function kuning() {
            document.getElementById("color_area").style.
                backgroundColor = "yellow"
        }
    </script>
</body>

</html>
